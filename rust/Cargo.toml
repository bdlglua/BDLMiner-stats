[package]
name = "bdlminer-stats"
version = "2.0.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
semver = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
[profile.release]
lto = true
strip = true
