name = "bdlminer-stats"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
logpush = false

[vars]
REMOTE_VIEWER_ORIGIN = "https://bdlglua.github.io"
# Legacy bookmarks and existing firmware links open the GitHub Pages viewer.
REMOTE_VIEWER_REDIRECT = "true"

# The reports, in the SQLite storage of one Durable Object (free plan).
[[durable_objects.bindings]]
name = "STORE"
class_name = "StatsStore"

[[durable_objects.bindings]]
name = "REMOTE"
class_name = "RemoteStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StatsStore"]

[[migrations]]
tag = "private-v1"
new_sqlite_classes = ["RemoteStore"]

[observability]
# Private bearer keys and request metadata must not enter invocation logs.
enabled = false
