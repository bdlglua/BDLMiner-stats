name: Test legacy components (no deployment)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/rust-worker
      - run: npm ci
      - run: npm test
      - run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path rust/Cargo.toml
      - run: node scripts/compare-rust.mjs
      - run: python3 -m unittest discover -s server -p 'test_*.py'
      - run: cargo fmt --manifest-path bridge/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path bridge/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: worker-build --release bridge
      - name: Exercise the Rust compatibility guards offline
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          python3 - <<'PYCONFIG'
          from pathlib import Path
          Path('.wrangler.prebuilt.toml').write_text(Path('wrangler.toml').read_text().split('\n[build]\n')[0])
          PYCONFIG
          npx --no-install wrangler dev --config .wrangler.prebuilt.toml --local --ip 127.0.0.1 --port 8900 --persist-to "$RUNNER_TEMP/stats-bridge" --var SELF_HOSTED_ORIGIN: > "$RUNNER_TEMP/stats-bridge.log" 2>&1 &
          bdl_bridge_pid=$!
          trap 'kill "$bdl_bridge_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -s http://127.0.0.1:8900/ >/dev/null; then break; fi
            sleep 1
          done
          npm run test:bridge || { tail -80 "$RUNNER_TEMP/stats-bridge.log"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: rust-worker
          path: bridge/build/
          if-no-files-found: error

