name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STATS_PASSWORD: ${{ secrets.STATS_PASSWORD }}
      WRANGLER: npx --yes wrangler@4.150.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Until the repository is set up (see README), there is nothing to deploy to.
      - name: Check the configuration
        id: config
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Not deployed, missing:$missing (see README)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the worker
        if: steps.config.outputs.ready == 'true'
        run: |
          $WRANGLER deploy
          # Optional: a password makes the page private.
          if [ -n "$STATS_PASSWORD" ]; then
            printf '%s' "$STATS_PASSWORD" | $WRANGLER secret put STATS_PASSWORD
          else
            $WRANGLER secret delete STATS_PASSWORD --force 2>/dev/null || true
          fi
