name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STATS_PASSWORD: ${{ secrets.STATS_PASSWORD }}
      WRANGLER: npx --yes wrangler@4.150.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Until the repository is set up (see README), there is nothing to deploy to.
      - name: Check the configuration
        id: config
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Not deployed, missing:$missing (see README)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the worker
        if: steps.config.outputs.ready == 'true'
        run: |
          $WRANGLER deploy
          # Optional: a password makes the page private.
          if [ -n "$STATS_PASSWORD" ]; then
            printf '%s' "$STATS_PASSWORD" | $WRANGLER secret put STATS_PASSWORD
          else
            $WRANGLER secret delete STATS_PASSWORD --force 2>/dev/null || true
          fi

      - name: Verify deployed private monitoring and revocation
        if: steps.config.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import json, os, secrets, time, tomllib, urllib.error, urllib.request
          from pathlib import Path
          base = 'https://bdlminer-stats.bdlminer-bot.workers.dev'
          key = secrets.token_hex(32)
          other = secrets.token_hex(32)
          def call(path, method='GET', body=None, access=key):
              headers = {'User-Agent':'BDLMiner-deployment-check/2.3.0', 'Cache-Control':'no-cache'}
              if access:
                  headers['Authorization'] = access if access.startswith('Address ') else 'Bearer ' + access
              if body is not None:
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(base + path, None if body is None else json.dumps(body).encode(), headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw and 'application/json' in response.headers.get('Content-Type', '') else None
              except urllib.error.HTTPError as error:
                  return error.code, {'error':error.read(256).decode(errors='replace')}
          for attempt in range(15):
              result = call('/remote', access=None)
              if result[0] == 200:
                  break
              print('Remote viewer HTTP', result[0], repr(result[1]), flush=True)
              time.sleep(2)
          else:
              raise RuntimeError('Remote viewer was not deployed')
          redirect_enabled = tomllib.loads(Path('wrangler.toml').read_text())['vars']['REMOTE_VIEWER_REDIRECT'] == 'true'
          if redirect_enabled:
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, *args):
                      return None
              opener = urllib.request.build_opener(NoRedirect)
              for attempt in range(30):
                  try:
                      response = opener.open(urllib.request.Request(base + '/remote', headers={
                          'User-Agent':'BDLMiner-deployment-check/2.3.0','Cache-Control':'no-cache'}), timeout=20)
                      response.close()
                  except urllib.error.HTTPError as error:
                      if error.code == 302 and error.headers.get('Location') == 'https://miner.bdl-pool.com/remote/':
                          break
                  if attempt == 29:
                      raise RuntimeError('Legacy viewer redirect was not activated')
                  time.sleep(2)
              print('PASS legacy viewer: redirects to https://miner.bdl-pool.com/remote/', flush=True)
          assert call('/api/remote', access=None)[0] == 401
          for origin in ('https://miner.bdl-pool.com', 'https://bdlglua.github.io'):
            probe = base + '/api/remote?deployment=' + os.environ['GITHUB_SHA']
            preflight = urllib.request.Request(probe, headers={
                'User-Agent':'BDLMiner-deployment-check/2.3.0', 'Origin':origin, 'Cache-Control':'no-cache',
                'Access-Control-Request-Method':'GET', 'Access-Control-Request-Headers':'authorization'}, method='OPTIONS')
            for attempt in range(30):
                try:
                    with urllib.request.urlopen(preflight, timeout=20) as response:
                        assert response.status == 204
                        assert response.headers['Access-Control-Allow-Origin'] == origin
                        assert response.headers.get('Access-Control-Allow-Credentials') is None
                    break
                except (urllib.error.HTTPError, AssertionError) as error:
                    if isinstance(error, urllib.error.HTTPError):
                        print('Preflight response:', error.code, error.headers.get('Server'), repr(error.read(200).decode(errors='replace')), flush=True)
                    if attempt == 29:
                        raise
                    print('Waiting for deployed GitHub-origin preflight:', getattr(error, 'code', 'headers'), flush=True)
                    time.sleep(2)
            guarded = urllib.request.Request(probe, headers={
                'User-Agent':'BDLMiner-deployment-check/2.3.0', 'Origin':origin, 'Cache-Control':'no-cache'})
            try:
                urllib.request.urlopen(guarded, timeout=20)
                raise RuntimeError('A private read was allowed without a key')
            except urllib.error.HTTPError as error:
                assert error.code == 401
                assert error.headers['Access-Control-Allow-Origin'] == origin
          fixture = {'id':'0000000000000001','name':'Deployment smoke (simulated)',
              'v':'2.3.0','board':'m5stickc-plus2','coin':'BTC','boot_id':'00000001',
              'uptime_s':60,'hashrate':0,'total_hashes':0,'temp_c':None,
              'accepted':0,'rejected':0,'best':0,'power_percent':0,
              'pool_connected':False,'pool':'unknown','firmware_trial':False}
          try:
              assert call('/api/remote/report', 'POST', fixture)[0] == 204
              assert len(call('/api/remote')[1]['miners']) == 1
              assert call('/api/remote', access=other)[1]['miners'] == []
          finally:
              assert call('/api/remote', 'DELETE')[0] == 204
              assert call('/api/remote', access=other, method='DELETE')[0] == 204
          assert call('/api/remote')[0] == 410
          assert call('/api/remote/report', 'POST', fixture)[0] == 410
          # Wallet-address spaces: readable without a key, never erasable by address. Read-only check.
          wallet = 'Address deploycheck' + os.environ['GITHUB_SHA'][:20]
          status, data = call('/api/remote', access=wallet)
          assert status == 200 and data['miners'] == [], (status, data)
          assert call('/api/remote', 'DELETE', access=wallet)[0] == 403
          print('PASS deployed private monitoring: viewer CORS (miner.bdl-pool.com and GitHub Pages), authorization, isolated data and permanent revocation; simulated readings erased.')
          PY
