[package]
name = "bdlminer-stats-bridge"
version = "2.0.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
worker = "=0.8.7"
serde_json = "1"
futures-util = "0.3"
url = "2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AbortSignal"] }
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
